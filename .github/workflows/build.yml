name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails the run if Valve assets or a generated asset pack were ever committed.
  no-valve-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository contains no TF2 / Source assets
        run: |
          bad=$(git ls-files | grep -iE '\.(vpk|mdl|vvd|vtx|phy|vtf|vmt|bsp|pcf)$|MercenariesTF2Assets.*\.zip$|merc_models/|textures/tf2/|sounds/tf2/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Valve assets must not be committed. Generate them locally with tools/extract_tf2_assets.py."
            echo "$bad"
            exit 1
          fi
          echo "OK: no Valve assets in the repository."

  extractor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install numpy pillow
      - name: Run extractor self-test (synthetic data, no TF2 needed)
        run: python tools/test_extractor.py

  build:
    runs-on: ubuntu-latest
    needs: [no-valve-assets]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mercenaries-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: tf2-asset-extractor
          path: |
            tools/extract_tf2_assets.py
            tools/test_extractor.py
            README.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, extractor-test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mercenaries-jar
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            tools/extract_tf2_assets.py
          generate_release_notes: true
          body: |
            Fabric mod for Minecraft 26.3 (requires Fabric API).
            No Valve assets are included. Run `extract_tf2_assets.py` against your own TF2 install
            to generate the optional resource pack (personal use only, do not redistribute).
